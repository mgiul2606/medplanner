version: '3.8'

services:
  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: medplanner-db
    environment:
      POSTGRES_USER: medplanner
      POSTGRES_PASSWORD: medplanner
      POSTGRES_DB: medplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medplanner-backend
    environment:
      DATABASE_URL: postgresql://medplanner:medplanner@db:5432/medplanner
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (opzionale - per servire build statico)
  # In dev si usa di solito npm run dev in locale
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: medplanner-frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ../frontend:/app
  #   command: npm run dev -- --host

volumes:
  postgres-data:
